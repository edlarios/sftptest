---
# ansible_non-zero_v2.yml
# Crea el directorio SFTP, sube los archivos y luego los mueve.
# Define sftp_password y directorio_destino en Semaphore o en el inventario.

- name: Transferencia y movimiento SFTP de archivos Montvia
  hosts: all
  gather_facts: false
  become: false

  vars:
    sftp_host_effective: "{{ hostvars[inventory_hostname].sftp_host | default(inventory_hostname) }}"
    sftp_user_effective: "{{ hostvars[inventory_hostname].sftp_user | default('I+D') }}"
    sftp_port_effective: "{{ hostvars[inventory_hostname].sftp_port | default(22) }}"
    sftp_remote_dir: "/tmp/montvia-staging"
    directorio_destino: "/tmp/montvia-destino"
    sftp_local_dir: "{{ playbook_dir }}/files"
    sftp_files:
      - montvia1.txt
      - montvia2.txt
      - montvia3.txt
      - montvia4.txt

  pre_tasks:
    - name: Validar variables SFTP
      ansible.builtin.assert:
        that:
          - sftp_password is defined
          - (sftp_password | string | length) > 0
          - sftp_host_effective | length > 0
          - sftp_user_effective | length > 0
          - directorio_destino | length > 0
        fail_msg: >-
          Faltan variables. Define sftp_password y directorio_destino en
          Semaphore o verifica las variables del inventario.
      delegate_to: localhost
      no_log: true

    - name: Verificar que sshpass esté instalado
      ansible.builtin.command:
        cmd: sshpass -V
      register: sshpass_check
      changed_when: false
      delegate_to: localhost

    - name: Mostrar configuración no sensible
      ansible.builtin.debug:
        msg:
          - "Host SFTP: {{ sftp_host_effective }}"
          - "Usuario SFTP: {{ sftp_user_effective }}"
          - "Puerto SFTP: {{ sftp_port_effective }}"
          - "Directorio de staging: {{ sftp_remote_dir }}"
          - "Directorio destino: {{ directorio_destino }}"
          - "Contraseña definida: {{ (sftp_password | string | length) > 0 }}"
          - "Cantidad de archivos: {{ sftp_files | length }}"
      delegate_to: localhost

  tasks:
    - name: Confirmar que existan los archivos locales
      ansible.builtin.stat:
        path: "{{ sftp_local_dir }}/{{ item }}"
      loop: "{{ sftp_files }}"
      register: archivos_origen_stat
      delegate_to: localhost

    - name: Detener si falta algún archivo local
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: "No existe el archivo local: {{ item.item }}"
      loop: "{{ archivos_origen_stat.results }}"
      delegate_to: localhost

    - name: Registrar inicio de la transferencia SFTP
      ansible.builtin.set_fact:
        transferencia_sftp_inicio: "{{ lookup('pipe', 'date +%s.%N') | float }}"
      delegate_to: localhost

    - name: Crear directorio de staging en el servidor SFTP
      ansible.builtin.shell: |
        printf '%s\n' "-mkdir {{ sftp_remote_dir }}" |
        sshpass -e sftp \
          -oBatchMode=no \
          -oPubkeyAuthentication=no \
          -oKbdInteractiveAuthentication=yes \
          -oPreferredAuthentications=password,keyboard-interactive \
          -oStrictHostKeyChecking=accept-new \
          -P {{ sftp_port_effective | quote }} \
          {{ (sftp_user_effective ~ '@' ~ sftp_host_effective) | quote }}
      args:
        executable: /bin/bash
      environment:
        SSHPASS: "{{ sftp_password }}"
      register: sftp_mkdir_staging
      changed_when: sftp_mkdir_staging.rc == 0
      failed_when: sftp_mkdir_staging.rc != 0
      delegate_to: localhost
      no_log: true

    - name: Crear directorio destino en el servidor SFTP
      ansible.builtin.shell: |
        printf '%s\n' "-mkdir {{ directorio_destino }}" |
        sshpass -e sftp \
          -oBatchMode=no \
          -oPubkeyAuthentication=no \
          -oKbdInteractiveAuthentication=yes \
          -oPreferredAuthentications=password,keyboard-interactive \
          -oStrictHostKeyChecking=accept-new \
          -P {{ sftp_port_effective | quote }} \
          {{ (sftp_user_effective ~ '@' ~ sftp_host_effective) | quote }}
      args:
        executable: /bin/bash
      environment:
        SSHPASS: "{{ sftp_password }}"
      register: sftp_mkdir_destino
      changed_when: sftp_mkdir_destino.rc == 0
      failed_when: sftp_mkdir_destino.rc != 0
      delegate_to: localhost
      no_log: true

    - name: Subir archivos al directorio de staging
      ansible.builtin.shell: |
        printf 'put %s %s\n' \
          {{ (sftp_local_dir ~ '/' ~ item) | quote }} \
          {{ (sftp_remote_dir ~ '/' ~ item) | quote }} |
        sshpass -e sftp \
          -oBatchMode=no \
          -oPubkeyAuthentication=no \
          -oKbdInteractiveAuthentication=yes \
          -oPreferredAuthentications=password,keyboard-interactive \
          -oStrictHostKeyChecking=accept-new \
          -P {{ sftp_port_effective | quote }} \
          {{ (sftp_user_effective ~ '@' ~ sftp_host_effective) | quote }}
      args:
        executable: /bin/bash
      environment:
        SSHPASS: "{{ sftp_password }}"
      register: sftp_upload
      changed_when: sftp_upload.rc == 0
      failed_when: sftp_upload.rc != 0
      delegate_to: localhost
      loop: "{{ sftp_files }}"
      loop_control:
        label: "{{ item }}"
      no_log: true

    - name: Registrar fin de la transferencia SFTP
      ansible.builtin.set_fact:
        transferencia_sftp_fin: "{{ lookup('pipe', 'date +%s.%N') | float }}"
        transferencia_sftp_segundos: >-
          {{ [
            ((lookup('pipe', 'date +%s.%N') | float) - (transferencia_sftp_inicio | float)),
            0.001
          ] | max }}
      delegate_to: localhost

    - name: Mover archivos al directorio destino remoto
      ansible.builtin.shell: |
        printf 'rename %s %s\n' \
          {{ (sftp_remote_dir ~ '/' ~ item) | quote }} \
          {{ (directorio_destino ~ '/' ~ item) | quote }} |
        sshpass -e sftp \
          -oBatchMode=no \
          -oPubkeyAuthentication=no \
          -oKbdInteractiveAuthentication=yes \
          -oPreferredAuthentications=password,keyboard-interactive \
          -oStrictHostKeyChecking=accept-new \
          -P {{ sftp_port_effective | quote }} \
          {{ (sftp_user_effective ~ '@' ~ sftp_host_effective) | quote }}
      args:
        executable: /bin/bash
      environment:
        SSHPASS: "{{ sftp_password }}"
      register: sftp_move
      changed_when: sftp_move.rc == 0
      failed_when: sftp_move.rc != 0
      delegate_to: localhost
      loop: "{{ sftp_files }}"
      loop_control:
        label: "{{ item }}"
      no_log: true

  post_tasks:
    - name: Mostrar métricas de la transferencia
      ansible.builtin.debug:
        msg:
          - "Archivos transferidos y movidos: {{ sftp_files | length }}"
          - >-
            Tamaño total: {{ (((archivos_origen_stat.results |
            map(attribute='stat.size') | map('int') | sum) / 1000000) | round(2)) }} MB
          - >-
            Tiempo total de transferencia: {{ ((transferencia_sftp_segundos / 60) | round(2)) }} minutos
          - >-
            Ancho de banda promedio: {{ ((((archivos_origen_stat.results |
            map(attribute='stat.size') | map('int') | sum) * 8) /
            transferencia_sftp_segundos) / 1000000) | round(2) }} Mbps
          - >-
            Velocidad promedio: {{ ((((archivos_origen_stat.results |
            map(attribute='stat.size') | map('int') | sum) /
            transferencia_sftp_segundos) / 1000000) | round(2)) }} MB/s
          - "Directorio destino: {{ directorio_destino }}"
      delegate_to: localhost
