---
- name: Limpiar y transferir archivos montvia a CIFS v5
  hosts: all
  gather_facts: false

  vars:
    directorio_destino: "/home/test"
    archivos_montvia:
      - montvia1.txt
      - montvia2.txt
      - montvia3.txt
      - montvia4.txt
      - montvia5.txt
    ansible_remote_tmp: "/tmp/.ansible-veb/tmp"
    ansible_ssh_transfer_method: sftp
    directorio_staging: "/tmp/montvia-staging"

  tasks:
    - name: Validar que exista el directorio remoto
      ansible.builtin.stat:
        path: "{{ directorio_destino }}"
      register: directorio_destino_stat

    - name: Detener si el directorio remoto no existe
      ansible.builtin.fail:
        msg: "El directorio remoto no existe o no es un directorio: {{ directorio_destino }}"
      when:
        - not directorio_destino_stat.stat.exists or not directorio_destino_stat.stat.isdir

    - name: Obtener tamaño de los archivos en el controlador Ansible
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/files/{{ item }}"
      delegate_to: localhost
      loop: "{{ archivos_montvia }}"
      loop_control:
        label: "{{ item }}"
      register: archivos_origen_stat

    - name: Validar que existan todos los archivos de origen
      ansible.builtin.fail:
        msg: "No existe el archivo de origen: {{ playbook_dir }}/files/{{ item.item }}"
      when: not item.stat.exists or not item.stat.isreg
      loop: "{{ archivos_origen_stat.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Calcular tamaño total de la transferencia
      ansible.builtin.set_fact:
        transferencia_bytes: "{{ archivos_origen_stat.results | map(attribute='stat.size') | map('int') | sum }}"

    - name: Crear directorio temporal de staging
      ansible.builtin.file:
        path: "{{ directorio_staging }}"
        state: directory

    - name: Buscar archivos montvia existentes en el destino CIFS
      ansible.builtin.find:
        paths:
          - "{{ directorio_destino }}"
        patterns:
          - "montvia*.txt"
        file_type: file
        recurse: false
      register: archivos_destino_existentes

    - name: Eliminar archivos montvia existentes del destino CIFS
      ansible.builtin.command:
        argv:
          - rm
          - -f
          - --
          - "{{ item.path }}"
      loop: "{{ archivos_destino_existentes.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Registrar inicio exacto de la tarea SFTP
      ansible.builtin.set_fact:
        transferencia_sftp_inicio_epoch: "{{ lookup('ansible.builtin.pipe', 'date +%s') | trim | int }}"

    - name: Transferir archivo al staging mediante SFTP
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ directorio_staging }}/{{ item | basename }}"
      loop: "{{ archivos_montvia }}"
      loop_control:
        label: "{{ item }}"

    - name: Registrar fin exacto de la tarea SFTP
      ansible.builtin.set_fact:
        transferencia_sftp_fin_epoch: "{{ lookup('ansible.builtin.pipe', 'date +%s') | trim | int }}"

    - name: Calcular tiempo de la tarea SFTP
      ansible.builtin.set_fact:
        transferencia_sftp_segundos: "{{ (transferencia_sftp_fin_epoch | int) - (transferencia_sftp_inicio_epoch | int) }}"
        transferencia_sftp_minutos: "{{ (((transferencia_sftp_fin_epoch | int) - (transferencia_sftp_inicio_epoch | int)) / 60) | round(2) }}"

    - name: Escribir archivos desde staging hacia el destino CIFS
      ansible.builtin.shell:
        cmd: >-
          cat {{ (directorio_staging + '/' + (item | basename)) | quote }}
          > {{ (directorio_destino + '/' + (item | basename)) | quote }}
      loop: "{{ archivos_montvia }}"
      loop_control:
        label: "{{ item }}"

    - name: Eliminar archivos temporales de staging
      ansible.builtin.file:
        path: "{{ directorio_staging }}/{{ item | basename }}"
        state: absent
      loop: "{{ archivos_montvia }}"
      loop_control:
        label: "{{ item }}"

    - name: Mostrar métricas de transferencia SFTP
      ansible.builtin.debug:
        msg:
          - "Archivos transferidos: {{ archivos_montvia | join(', ') }}"
          - "Bytes transferidos por SFTP: {{ transferencia_bytes }}"
          - "Tamaño total: {{ (transferencia_bytes | float / 1048576) | round(2) }} MiB"
          - "Tiempo de la tarea SFTP: {{ transferencia_sftp_minutos }} minutos"
          - "Ancho de banda promedio SFTP: {{ ((transferencia_bytes | float * 8) / (transferencia_sftp_segundos | float) / 1000000) | round(2) }} Mbit/s"
          - "Velocidad promedio SFTP: {{ ((transferencia_bytes | float / 1048576) / (transferencia_sftp_segundos | float)) | round(2) }} MiB/s"
      when: transferencia_sftp_segundos | int > 0

